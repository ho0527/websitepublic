<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img"
     aria-labelledby="featureLeaderboardTitle featureLeaderboardDesc">
    <title id="featureLeaderboardTitle">Highscore leaderboard 功能示意圖</title>
    <desc id="featureLeaderboardDesc">
        高分排行榜示意畫面，依序列出前五名玩家的名次、玩家名稱、遊戲名稱與分數，
        前三名以金、銀、銅色徽章標示。
    </desc>

    <rect width="800" height="500" rx="18" fill="#151B33"/>
    <rect x="0" y="0" width="800" height="64" rx="18" fill="#1E2647"/>
    <rect x="0" y="46" width="800" height="18" fill="#1E2647"/>
    <text x="34" y="39" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#F5F7FF">
        Global highscore leaderboard
    </text>

    <!-- 表頭 -->
    <text x="52" y="110" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#22D3EE">RANK</text>
    <text x="176" y="110" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#22D3EE">PLAYER</text>
    <text x="424" y="110" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#22D3EE">GAME</text>
    <text x="668" y="110" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#22D3EE">SCORE</text>
    <rect x="34" y="122" width="732" height="2" fill="#2B3560"/>

    <!-- 第 1 名 -->
    <rect x="34" y="134" width="732" height="62" rx="12" fill="#1B2340" stroke="#FFD166" stroke-width="3"/>
    <circle cx="70" cy="165" r="18" fill="#FFD166"/>
    <text x="63" y="172" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#3A2B00">1</text>
    <text x="176" y="173" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#F5F7FF">NovaKite</text>
    <text x="424" y="173" font-family="Segoe UI, sans-serif" font-size="20" fill="#B9C0DA">Neon Racer</text>
    <text x="668" y="173" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#FFD166">98,540</text>

    <!-- 第 2 名 -->
    <rect x="34" y="206" width="732" height="62" rx="12" fill="#1B2340"/>
    <circle cx="70" cy="237" r="18" fill="#CBD5E1"/>
    <text x="63" y="244" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#1F2937">2</text>
    <text x="176" y="245" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#F5F7FF">Pixel_Rin</text>
    <text x="424" y="245" font-family="Segoe UI, sans-serif" font-size="20" fill="#B9C0DA">Block Fall</text>
    <text x="668" y="245" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#F5F7FF">91,220</text>

    <!-- 第 3 名 -->
    <rect x="34" y="278" width="732" height="62" rx="12" fill="#1B2340"/>
    <circle cx="70" cy="309" r="18" fill="#E8A87C"/>
    <text x="63" y="316" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#3A2000">3</text>
    <text x="176" y="317" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#F5F7FF">Aki_Lo</text>
    <text x="424" y="317" font-family="Segoe UI, sans-serif" font-size="20" fill="#B9C0DA">Sky Diver</text>
    <text x="668" y="317" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#F5F7FF">88,010</text>

    <!-- 第 4 名 -->
    <rect x="34" y="350" width="732" height="62" rx="12" fill="#1B2340"/>
    <text x="61" y="389" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#B9C0DA">4</text>
    <text x="176" y="389" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#F5F7FF">Mika99</text>
    <text x="424" y="389" font-family="Segoe UI, sans-serif" font-size="20" fill="#B9C0DA">Neon Racer</text>
    <text x="668" y="389" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#F5F7FF">80,764</text>

    <!-- 第 5 名 -->
    <rect x="34" y="422" width="732" height="62" rx="12" fill="#1B2340"/>
    <text x="61" y="461" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#B9C0DA">5</text>
    <text x="176" y="461" font-family="Segoe UI, sans-serif" font-size="22" font-weight="600" fill="#F5F7FF">deepFry</text>
    <text x="424" y="461" font-family="Segoe UI, sans-serif" font-size="20" fill="#B9C0DA">Cube Rush</text>
    <text x="668" y="461" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#F5F7FF">77,432</text>
</svg>
