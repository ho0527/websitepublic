<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 268 56" width="268" height="56" role="img" aria-label="EnviroFund">
  <title>EnviroFund</title>
  <defs>
    <!-- 幣體漸層：由淺綠到深綠，象徵「成長中的資金」 -->
    <linearGradient id="ef-coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3FD69B"/>
      <stop offset="1" stop-color="#12805E"/>
    </linearGradient>
  </defs>

  <!-- 圖形元素：硬幣（募資）＋葉片（環境） -->
  <g>
    <circle cx="28" cy="28" r="24" fill="url(#ef-coin)"/>
    <circle cx="28" cy="28" r="24" fill="none" stroke="#0E5F45" stroke-opacity=".25" stroke-width="2"/>
    <!-- 葉片：以 24x24 圖徽等比放大置中 -->
    <g transform="translate(11.5 11.5) scale(1.375)">
      <path fill="#FFFFFF"
            d="M17 8C8 10 5.9 16.17 3.82 21.34l1.89.66.95-2.3c.48.17.98.3 1.34.3C19 20 22 3 22 3c-1 2-8 2.25-13 3.25S2 11.5 2 13.5s1.75 3.75 1.75 3.75C7 8 17 8 17 8z"/>
    </g>
  </g>

  <!-- 文字標：Enviro（深綠）＋ Fund（亮綠） -->
  <text x="64" y="37"
        font-family="'Segoe UI Semibold','Segoe UI',Arial,Helvetica,sans-serif"
        font-size="27" font-weight="700" letter-spacing="-.4">
    <tspan fill="#0E2A22">Enviro</tspan><tspan fill="#1FA97A">Fund</tspan>
  </text>
  <!-- 副標語 -->
  <text x="66" y="49" font-family="'Segoe UI',Arial,Helvetica,sans-serif"
        font-size="8" letter-spacing="1.9" fill="#6E8A80">CROWD FUNDING FOR THE PLANET</text>
</svg>
