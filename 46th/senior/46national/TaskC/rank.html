<!DOCTYPE html>
<html lang="zh-Hant">
    <head>

        <title>俄羅斯方塊 - 排行榜</title>
        <link rel="icon" href="material/icon/mainicon.png">
        <link rel="stylesheet" href="common.css">

    </head>
    <body>
        <main class="rankpage">
            <h1 class="ranktitle">排行榜</h1>

            <!-- 難度頁籤 -->

            <table class="ranktable">
                <thead>
                    <tr>

                        <th>暱稱</th>

                    </tr>
                </thead>
                <tbody id="rankBody"></tbody>
            </table>

            <a class="backlink" href="index.html">回到首頁</a>
        </main>

        <!-- 共用模組 -->
        <script src="js/tetromino.js"></script>
        <script src="js/storage.js"></script>
