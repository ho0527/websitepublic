<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<title>申請列表 - Best platform to deal the house</title>
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<header class="site-header" id="site-header"></header>

		<main class="container">
			<!-- 搜尋表單 -->
			<section class="panel search-panel">
				<div class="search-bar">
					<input type="text" id="keyword" placeholder="Keyword">
					<button type="button" class="button" id="search-button">Search</button>
				</div>

				<!-- 搜尋條件設定區塊 -->
				<div class="field-row">
					<span class="field-label">Price</span>
					<input type="number" id="min-price" min="0" placeholder="最低價格">
					<span>—</span>
					<input type="number" id="max-price" min="0" placeholder="最高價格">
				</div>

				<div class="field-row">
					<span class="field-label">Room</span>
					<div class="radio-group">
						<label><input type="radio" name="room" value="" checked> 不限</label>
						<label><input type="radio" name="room" value="1"> 1</label>
						<label><input type="radio" name="room" value="2"> 2</label>
						<label><input type="radio" name="room" value="3"> 3</label>
						<label><input type="radio" name="room" value="more"> More</label>
					</div>
				</div>

				<div class="field-row">
					<span class="field-label">Age</span>
					<div class="radio-group">
						<label><input type="radio" name="age" value="" checked> 不限</label>
						<label><input type="radio" name="age" value="0-5"> Below 5y</label>
						<label><input type="radio" name="age" value="5-10"> 5-10y</label>
						<label><input type="radio" name="age" value="10-20"> 10-20y</label>
						<label><input type="radio" name="age" value="20-"> 20 up</label>
					</div>
				</div>

				<!-- 審核狀態，預設只顯示申請中 -->
				<div class="field-row">
					<span class="field-label">Status</span>
					<div class="radio-group">
						<label><input type="radio" name="status" value="applied" checked> Applied</label>
						<label><input type="radio" name="status" value="approved"> Approved</label>
						<label><input type="radio" name="status" value="rejected"> Rejected</label>
						<label><input type="radio" name="status" value="all"> All</label>
					</div>
					<!-- 升 / 降冪切換器（依申請時間） -->
					<button type="button" class="button ghost small" id="order-toggle">降冪 ↓</button>
				</div>
			</section>

			<h2 class="result-title" id="result-title">Result</h2>
			<div class="message" id="message"></div>

			<!-- 房屋列表 -->
			<div class="house-list" id="house-list"></div>

			<!-- 分頁切換器 -->
			<div class="pagination" id="pagination"></div>
		</main>

		<script src="initialize.js"></script>
		<script src="application.js"></script>
	</body>
</html>
