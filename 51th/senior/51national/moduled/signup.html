<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<title>註冊 - Best platform to deal the house</title>
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<header class="site-header" id="site-header"></header>

		<main class="container">
			<section class="panel auth-box">
				<h1 class="panel-title">Sign Up</h1>

				<!-- 註冊表單 -->
				<form id="signup-form" novalidate>
					<div class="field-row">
						<label class="field-label" for="email">Email</label>
						<input type="email" id="email" name="email" autocomplete="username" placeholder="eli@localhost">
					</div>
					<div class="field-row">
						<label class="field-label" for="nickname">Nickname</label>
						<input type="text" id="nickname" name="nickname" placeholder="請輸入暱稱">
					</div>
					<div class="field-row">
						<label class="field-label" for="password">Password</label>
						<input type="password" id="password" name="password" autocomplete="new-password" placeholder="請輸入密碼">
					</div>

					<div class="message" id="message"></div>

					<button type="submit" class="button" id="submit" style="width:100%">註冊</button>
				</form>

				<p class="meta" style="margin-top:12px">
					已經有帳號了嗎？<a href="signin.html">前往登入</a>
				</p>
			</section>
		</main>

		<script src="initialize.js"></script>
		<script src="signup.js"></script>
	</body>
</html>
