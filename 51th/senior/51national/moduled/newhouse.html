<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<title>刊登房屋 - Best platform to deal the house</title>
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<header class="site-header" id="site-header"></header>

		<main class="container">
			<section class="panel">
				<h1 class="panel-title" id="page-title">New House</h1>

				<!-- 房屋資料表單 -->
				<form id="house-form" novalidate>
					<div class="form-grid">
						<div class="full">
							<label for="title">標題 Title</label>
							<input type="text" id="title" name="title" placeholder="My adorable apartment">
						</div>

						<div>
							<label for="price">價格 Price</label>
							<input type="number" id="price" name="price" min="0" placeholder="10000000">
						</div>
						<div>
							<label for="square">坪數 Square</label>
							<input type="number" id="square" name="square" min="0" placeholder="20">
						</div>
						<div>
							<label for="room">房數 Room</label>
							<input type="number" id="room" name="room" min="0" placeholder="2">
						</div>
						<div>
							<label for="floor">樓層 Floor</label>
							<input type="number" id="floor" name="floor" placeholder="3">
						</div>
						<div>
							<label for="total_floor">總樓層 Total floor</label>
							<input type="number" id="total_floor" name="total_floor" placeholder="12">
						</div>
						<div>
							<label for="age">屋齡 Age</label>
							<input type="number" id="age" name="age" min="0" placeholder="3">
						</div>

						<div class="full">
							<label for="address">地址 Address</label>
							<input type="text" id="address" name="address" placeholder="桃園市中壢區萬能路 1 號">
						</div>

						<div class="full">
							<label for="description">描述 Description</label>
							<textarea id="description" name="description" placeholder="Write something ..."></textarea>
						</div>

						<div class="full">
							<label for="images">圖片 Images（可多選，並可調整順序與指定封面）</label>
							<input type="file" id="images" name="images" accept="image/*" multiple>
							<div class="image-editor" id="image-editor"></div>
						</div>
					</div>

					<div class="message" id="message"></div>

					<div class="search-bar" style="margin-top:12px">
						<!-- 送出按鈕 -->
						<button type="submit" class="button" id="submit">Submit</button>
						<a class="button ghost" href="publish.html">回到刊登列表</a>
					</div>
				</form>
			</section>
		</main>

		<script src="initialize.js"></script>
		<script src="newhouse.js"></script>
	</body>
</html>
