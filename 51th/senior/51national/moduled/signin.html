<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<title>登入 - Best platform to deal the house</title>
		<link rel="stylesheet" href="index.css">
	</head>
	<body>
		<header class="site-header" id="site-header"></header>

		<main class="container">
			<section class="panel auth-box">
				<h1 class="panel-title">Sign In</h1>

				<!-- 登入表單 -->
				<form id="signin-form" novalidate>
					<div class="field-row">
						<label class="field-label" for="email">Email</label>
						<input type="email" id="email" name="email" autocomplete="username" placeholder="admin@localhost">
					</div>
					<div class="field-row">
						<label class="field-label" for="password">Password</label>
						<input type="password" id="password" name="password" autocomplete="current-password" placeholder="請輸入密碼">
					</div>

					<div class="message" id="message"></div>

					<button type="submit" class="button" id="submit" style="width:100%">登入</button>
				</form>

				<p class="meta" style="margin-top:12px">
					還沒有帳號嗎？<a href="signup.html">前往註冊</a>
				</p>
			</section>
		</main>

		<script src="initialize.js"></script>
		<script src="signin.js"></script>
	</body>
</html>
