<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Module B Photo Slideshow</title>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then((items) => items.forEach((item) => item.unregister()));
    }
    if ("caches" in window) {
      caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
    }
  </script>
  <link rel="stylesheet" href="./index.css?v=20260811">
  <link rel="stylesheet" href="./theme-a.css?v=20260811">
  <link rel="stylesheet" href="./theme-b.css?v=20260811">
  <link rel="stylesheet" href="./theme-c.css?v=20260811">
  <link rel="stylesheet" href="./theme-d.css?v=20260811">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="settingsButton" type="button" aria-label="Open settings" title="Settings">
        <img class="button-icon" src="./material/icons/settings.svg" alt="">
      </button>
      <div>
        <p class="eyebrow">Module B</p>
        <h1>Photo Slideshow</h1>
      </div>
      <div class="topbar-actions">
        <button class="text-button" id="sampleButton" type="button">Load Samples</button>
        <button class="icon-button" id="fullscreenButton" type="button" aria-label="Fullscreen" title="Fullscreen">F</button>
      </div>
    </header>

    <main class="workspace">
      <section class="viewer-panel" id="dropZone">
        <div class="slideshow theme-a" id="slideshow" tabindex="0" aria-label="Photo slideshow">
          <div class="empty-state" id="emptyState">
            <strong>Drop photos here</strong>
            <span>or use the buttons to upload files or load sample photos.</span>
          </div>
          <!-- 兩層投影片：outgoing 播放離場動畫，incoming 播放進場動畫 -->
          <figure class="slide slide-outgoing" id="slideOutgoing" aria-hidden="true">
            <img id="slideOutgoingImage" alt="">
            <figcaption id="slideOutgoingCaption"></figcaption>
          </figure>
          <figure class="slide" id="slide">
            <img id="slideImage" alt="">
            <figcaption id="slideCaption"></figcaption>
          </figure>
        </div>
        <div class="viewer-toolbar">
          <input id="fileInput" type="file" accept="image/*" multiple hidden>
          <button class="text-button" id="uploadButton" type="button">Upload Photos</button>
          <button class="icon-button" id="previousButton" type="button" aria-label="Previous photo" title="Previous">&lt;</button>
          <button class="icon-button" id="playButton" type="button" aria-label="Play or pause" title="Play/Pause">
            <img class="button-icon" id="playIcon" src="./material/icons/play.svg" alt="">
          </button>
          <button class="icon-button" id="nextButton" type="button" aria-label="Next photo" title="Next">&gt;</button>
          <span class="counter" id="counter">0 / 0</span>
          <span class="load-status" id="loadStatus" aria-live="polite"></span>
        </div>
      </section>

      <div class="panel-backdrop" id="panelBackdrop" hidden></div>
      <aside class="side-panel" id="settingsPanel" aria-label="Slideshow settings">
        <div class="panel-heading">
          <h2>Settings</h2>
          <button class="icon-button panel-close" id="closeSettingsButton" type="button" aria-label="Close settings" title="Close">x</button>
        </div>

        <section class="control-group">
          <h3>Mode</h3>
          <div class="segmented" role="group" aria-label="Playback mode">
            <button type="button" data-mode="manual">Manual</button>
            <button type="button" data-mode="auto">Auto</button>
            <button type="button" data-mode="random">Random</button>
          </div>
        </section>

        <section class="control-group">
          <h3>Theme</h3>
          <div class="segmented theme-picker" role="group" aria-label="Theme">
            <button type="button" data-theme="a">A</button>
            <button type="button" data-theme="b">B</button>
            <button type="button" data-theme="c">C</button>
            <button type="button" data-theme="d">D</button>
          </div>
        </section>

        <section class="control-group two-column">
          <label>
            Display time
            <input id="intervalInput" type="number" min="1" max="30" step="1">
          </label>
          <label>
            Transition
            <input id="speedInput" type="number" min="0.2" max="5" step="0.1">
          </label>
        </section>

        <section class="control-group">
          <label class="range-label" for="intervalRange">
            <span>Seconds per photo</span>
            <input id="intervalRange" type="range" min="1" max="30" step="1">
          </label>
          <label class="range-label" for="speedRange">
            <span>Animation speed</span>
            <input id="speedRange" type="range" min="0.2" max="5" step="0.1">
          </label>
        </section>

        <section class="control-group inline-control">
          <label>
            <input id="darkModeToggle" type="checkbox">
            Dark mode
          </label>
          <button class="text-button has-icon" id="shuffleButton" type="button">
            <img class="button-icon" src="./material/icons/shuffle.svg" alt="">
            Shuffle Photos
          </button>
        </section>

        <section class="control-group">
          <div class="panel-heading compact">
            <h3>Photo Order</h3>
            <span class="hint">Drag to reorder, edit captions inline.</span>
          </div>
          <div class="photo-list" id="photoList" aria-live="polite"></div>
        </section>
      </aside>
    </main>
  </div>

  <div class="palette-backdrop" id="paletteBackdrop" hidden></div>
  <section class="command-palette" id="commandPalette" hidden aria-label="Command palette">
    <input id="commandInput" type="text" autocomplete="off" placeholder="Type a command">
    <div class="command-list" id="commandList" role="listbox"></div>
  </section>

  <script src="./index.js?v=20260811"></script>
</body>
</html>
