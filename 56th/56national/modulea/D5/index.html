<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>D5: 文字水波模糊特效（等級 2）</title>
	<style>
		body {
			margin: 0px;
			min-height: 100vh;
			padding: 40px 20px;
			background: #0f1216;
			color: #e6edf3;
			font-family: "Microsoft JhengHei", Arial, Helvetica, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 14px;
			text-align: center;
		}

		h1 {
			font-size: 20px;
			margin: 0px;
		}

		p {
			color: #8b949e;
			font-size: 14px;
			margin: 0px;
			max-width: 620px;
			line-height: 1.7;
		}

		code {
			background: #21262d;
			padding: 2px 6px;
			border-radius: 4px;
			font-size: 13px;
		}

		img {
			max-width: min(90vw, 900px);
			border-radius: 10px;
			border: 1px solid #2a313a;
			background: repeating-conic-gradient(#2a313a 0% 25%, #1c232c 0% 50%) 50% / 20px 20px;
		}

		/* favicon 預覽要看得出像素，不要被平滑化 */
		img.pixel {
			image-rendering: pixelated;
		}

		.note {
			font-size: 13px;
		}

		a {
			color: #58a6ff;
		}
	</style>
</head>

<body>
	<h1>D5: 文字水波模糊特效（等級 2）</h1>
	<p>將文字「LYON」（#2D2B53）置於 asset.jpg 的水面上並製作反射模糊，交件檔為 <code>result.png</code>。</p>
	<img src="result.png" alt="result"><p><a href="result.png" download>下載 result.png</a></p>
</body>

</html>
