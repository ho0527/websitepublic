<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>A1 Rain</title>
	<style>
		* {
			box-sizing: border-box
		}

		body {
			margin: 0;
			height: 100vh;
			overflow: hidden;
			background: white;
			display: flex;
			align-items: center;
			justify-content: center;
			font-family: Arial, sans-serif;
			color: white
		}

		.scene {
			position: relative;
			width: 100%;
			height: 100%;
			overflow: hidden
		}

		.drop {
			position: absolute;
			top: 0%;
			width: 2px;
			height: 100px;
			border-radius: 99px;
			background: black;
			animation: fall 1s linear infinite
		}

		h1 {
			position: absolute;
			bottom: 22%;
			width: 100%;
			text-align: center;
			font-size: 48px;
			letter-spacing: 2px;
			text-shadow: 0 4px 16px #000
		}

		@keyframes fall {
			to {
				transform: translateY(100vh);
				opacity: .1
			}
		}
	</style>
</head>

<body>
	<div class="scene" id="scene">
	</div>
	<script>
		const scene = document.getElementById("scene")
		for (let i = 0; i < 70; i++) {
			const d = document.createElement("span")
			d.className = "drop"
			d.style.left = Math.random() * 100 + "%"
			d.style.height = 10+(Math.random() * 190) + "px"
			d.style.animationDelay = "-"+(Math.random() + "s")
			d.style.animationDuration = .55 + Math.random() * .8 + "s"
			scene.appendChild(d)
		}
	</script>
</body>

</html>
