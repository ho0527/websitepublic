<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>B11 相片幻燈片</title>
	<style>
		/*
		 * B11: 相片幻燈片（等級 2）
		 * 捲動畫面時相片會旋轉：整組相片排在一個 3D 圓柱上，
		 * 捲動位置決定圓柱的旋轉角度，因此往下捲就會一張張轉過來。
		 */

		body {
			margin: 0px;
			background: #0b0e14;
			font-family: "Microsoft JhengHei", Arial, Helvetica, sans-serif;
			color: #e6edf3;
		}

		/* 捲動用的高度，越高可以轉越多圈 */
		.scroll-space {
			height: 500vh;
		}

		/* 幻燈片固定在畫面中間，不隨捲動離開 */
		.viewport {
			position: fixed;
			inset: 0px;
			display: grid;
			place-items: center;
			perspective: 1600px;
			overflow: hidden;
		}

		.carousel {
			position: relative;
			width: 340px;
			height: 240px;
			transform-style: preserve-3d;
			transition: transform 0.15s linear;
		}

		.slide {
			position: absolute;
			inset: 0px;
			border-radius: 12px;
			overflow: hidden;
			box-shadow: 0px 14px 34px rgba(0, 0, 0, 0.6);
			backface-visibility: hidden;
		}

		.slide img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}

		.tip {
			position: fixed;
			left: 50%;
			bottom: 28px;
			transform: translateX(-50%);
			color: rgba(255, 255, 255, 0.6);
			font-size: 15px;
			user-select: none;
		}
	</style>
</head>

<body>
	<div class="viewport">
		<div class="carousel" id="carousel">
			<div class="slide"><img src="images/cover-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/attraction-a-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/attraction-b-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/attraction-c-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/all-attractions-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/fda-p-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/lyon-kayak-p-0-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/semaine-bleue-2024-p-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/village-des-metiers-p-low-res.jpg" alt=""></div>
			<div class="slide"><img src="images/worldskills-2024-p-low-res.png" alt=""></div>
			<div class="slide"><img src="images/journees_portes_ouvertes_entreprises_2023_p-low-res.jpg" alt=""></div>
		</div>
	</div>

	<div class="scroll-space"></div>
	<div class="tip">往下捲動，相片會跟著旋轉</div>

	<script>
		const carousel = document.getElementById("carousel")
		const slides = document.querySelectorAll(".slide")
		const RADIUS = 420                       // 圓柱半徑
		const STEP = 360 / slides.length         // 每張相片之間的角度

		// 把每張相片放到圓柱上的固定位置
		slides.forEach(function (slide, index) {
			slide.style.transform = "rotateY(" + (index * STEP) + "deg) translateZ(" + RADIUS + "px)"
		})

		/** 依捲動進度旋轉整個圓柱 */
		function onScroll() {
			const maxScroll = document.body.scrollHeight - window.innerHeight
			const progress = maxScroll > 0 ? window.scrollY / maxScroll : 0
			// 捲完整份頁面剛好轉兩圈
			const angle = progress * 720
			carousel.style.transform = "rotateY(" + (-angle) + "deg)"
		}

		window.addEventListener("scroll", onScroll, { passive: true })
		onScroll()
	</script>
</body>

</html>
