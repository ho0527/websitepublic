<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>B10 Word Shuffle</title>
	<style>
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: #f8fafc;
			font-family: Arial, sans-serif;
		}

		main {
			width: min(680px, 92vw);
		}

		textarea {
			width: 100%;
			height: 120px;
			padding: 12px;
			border: 1px solid #94a3b8;
			border-radius: 8px;
			font-size: 18px;
		}

		button {
			margin: 12px 8px 12px 0;
			padding: 10px 16px;
			border: 0;
			border-radius: 8px;
			background: #0f766e;
			color: white;
			font-weight: bold;
			cursor: pointer;
		}

		#result {
			display: flex;
			gap: 8px;
			flex-wrap: wrap;
			justify-content: center;
		}

		.word {
			background: #ccfbf1;
			border: 1px solid #2dd4bf;
			border-radius: 5px;
			padding: 10px 15px;
		}

		.center{
			text-align: center;
		}
	</style>
</head>

<body>
	<main>
		<h1>Split and Shuffle Words</h1>
		<textarea id="text">testtext</textarea>
		<div id="result"></div>
		<div class="center">
			<button id="shuffle">Shuffle button(隨機打亂)</button>
		</div>
	</main>

	<script>
		let words = []
		function render() {
			result.innerHTML = words.map(w => `<span class="word">${w}</span>`).join("")
		}
		shuffle.onclick = function () {
			words = text.value.trim().split("").filter(Boolean)
			for (let i = words.length - 1; i > 0; i--) {
				let j = Math.floor(Math.random() * (i + 1));[words[i], words[j]] = [words[j], words[i]]
			}
			render()
		}
		text.oninput=function(){
			words = text.value.trim().split("").filter(Boolean)
			render()
		}
	</script>
</body>

</html>
