<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>D3 Speed Effect</title>
	<style>
		body{margin:0;height:100vh;background:#020617;display:grid;place-items:center;overflow:hidden;font-family:Arial,sans-serif;color:white}
		.wrap{position:relative;width:min(820px,92vw);overflow:hidden;border-radius:12px}
		img{width:100%;display:block;filter:contrast(1.1) saturate(1.15)}
		.wrap:before,.wrap:after{content:"";position:absolute;inset:-20%;background:repeating-linear-gradient(100deg,transparent 0 24px,rgba(255,255,255,.22) 25px 30px);mix-blend-mode:screen;animation:speed .45s linear infinite}
		.wrap:after{background:linear-gradient(90deg,transparent,#ffffff88,transparent);filter:blur(12px);animation:sweep 1.4s linear infinite}
		h1{position:absolute;left:24px;bottom:18px;text-shadow:0 2px 10px #000}
		@keyframes speed{to{transform:translateX(90px)}}
		@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(120%)}}
	</style>
</head>
<body>
	<div class="wrap"><img src="asset.jpg" alt="speed"><h1>Speed Effect</h1></div>
</body>
</html>
