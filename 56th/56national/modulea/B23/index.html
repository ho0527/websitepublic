<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>B23 電子簽名</title>
	<style>
		body {
			margin: 0px;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			background: #f6f8fa;
			font-family: "Microsoft JhengHei", Arial, Helvetica, sans-serif;
			color: #1f2328;
		}

		h1 {
			font-size: 20px;
			margin: 0px;
		}

		.hint {
			color: #59636e;
			font-size: 14px;
			margin: 0px;
		}

		canvas {
			background: #ffffff;
			border: 2px dashed #b6c2cf;
			border-radius: 10px;
			cursor: crosshair;
			touch-action: none;   /* 觸控時不要捲動頁面 */
		}

		.buttons {
			display: flex;
			gap: 12px;
		}

		button {
			border: 1px solid #d0d7de;
			background: #ffffff;
			border-radius: 6px;
			padding: 10px 26px;
			font-size: 15px;
			font-family: inherit;
			cursor: pointer;
			transition-duration: 0.3s;
		}

		button:hover {
			border-color: #1f6feb;
			color: #1f6feb;
		}

		#save {
			background: #1f6feb;
			border-color: #1f6feb;
			color: #ffffff;
		}

		#save:hover {
			background: #3b82f6;
			color: #ffffff;
		}
	</style>
</head>

<body>
	<h1>電子簽名</h1>
	<p class="hint">用滑鼠或觸控在下方區域簽名</p>

	<!-- 畫布尺寸大於題目要求的 400×200 -->
	<canvas id="canvas" width="560" height="240"></canvas>

	<div class="buttons">
		<button id="clear">清除</button>
		<button id="save">儲存為 PNG</button>
	</div>

	<script>
		/*
		 * B23: 電子簽名（等級 2）
		 * 滑鼠或觸控可自由繪製；清除會重設整個畫布；儲存會下載 PNG。
		 * 線條以二次貝茲曲線連接中點，讓筆跡平滑不會有折角。
		 */

		const canvas = document.getElementById("canvas")
		const context = canvas.getContext("2d")

		context.lineWidth = 2.6
		context.lineCap = "round"
		context.lineJoin = "round"
		context.strokeStyle = "#111827"

		let isDrawing = false
		let lastPoint = null
		let currentPoint = null

		/** 取得指標在畫布上的座標 */
		function getPosition(event) {
			const rect = canvas.getBoundingClientRect()
			return {
				x: (event.clientX - rect.left) * (canvas.width / rect.width),
				y: (event.clientY - rect.top) * (canvas.height / rect.height)
			}
		}

		canvas.addEventListener("pointerdown", function (event) {
			isDrawing = true
			lastPoint = getPosition(event)
			currentPoint = lastPoint
			// 點一下也要留下一個點
			context.beginPath()
			context.arc(lastPoint.x, lastPoint.y, context.lineWidth / 2, 0, Math.PI * 2)
			context.fillStyle = context.strokeStyle
			context.fill()
			canvas.setPointerCapture(event.pointerId)
		})

		canvas.addEventListener("pointermove", function (event) {
			if (!isDrawing) {
				return
			}
			const point = getPosition(event)
			// 以兩點的中點作為曲線終點，串起來就會是平滑的線
			const midX = (currentPoint.x + point.x) / 2
			const midY = (currentPoint.y + point.y) / 2

			context.beginPath()
			context.moveTo(lastPoint.x, lastPoint.y)
			context.quadraticCurveTo(currentPoint.x, currentPoint.y, midX, midY)
			context.stroke()

			lastPoint = { x: midX, y: midY }
			currentPoint = point
		})

		canvas.addEventListener("pointerup", function () {
			isDrawing = false
		})

		document.getElementById("clear").onclick = function () {
			context.clearRect(0, 0, canvas.width, canvas.height)
		}

		document.getElementById("save").onclick = function () {
			// 先鋪白底再輸出，避免透明背景在其他軟體看起來是黑的
			const output = document.createElement("canvas")
			output.width = canvas.width
			output.height = canvas.height
			const outputContext = output.getContext("2d")
			outputContext.fillStyle = "#ffffff"
			outputContext.fillRect(0, 0, output.width, output.height)
			outputContext.drawImage(canvas, 0, 0)

			const link = document.createElement("a")
			link.href = output.toDataURL("image/png")
			link.download = "signature.png"
			document.body.appendChild(link)
			link.click()
			document.body.removeChild(link)
		}
	</script>
</body>

</html>
