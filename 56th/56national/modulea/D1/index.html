<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>D1: Favicon 設計（等級 1）</title>
	<link rel="icon" href="favicon.ico">
	<style>
		body {
			margin: 0px;
			min-height: 100vh;
			padding: 40px 20px;
			background: #0f1216;
			color: #e6edf3;
			font-family: "Microsoft JhengHei", Arial, Helvetica, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 14px;
			text-align: center;
		}

		h1 {
			font-size: 20px;
			margin: 0px;
		}

		p {
			color: #8b949e;
			font-size: 14px;
			margin: 0px;
			max-width: 620px;
			line-height: 1.7;
		}

		code {
			background: #21262d;
			padding: 2px 6px;
			border-radius: 4px;
			font-size: 13px;
		}

		img {
			max-width: min(90vw, 900px);
			border-radius: 10px;
			border: 1px solid #2a313a;
			background: repeating-conic-gradient(#2a313a 0% 25%, #1c232c 0% 50%) 50% / 20px 20px;
		}

		/* favicon 預覽要看得出像素，不要被平滑化 */
		img.pixel {
			image-rendering: pixelated;
		}

		.note {
			font-size: 13px;
		}

		a {
			color: #58a6ff;
		}
	</style>
</head>

<body>
	<h1>D1: Favicon 設計（等級 1）</h1>
	<p>使用字母「B」設計的 16×16 favicon，交件檔為 <code>favicon.ico</code>。</p>
	<img class="pixel" src="favicon-preview.png" alt="favicon 放大預覽" width="192"><p class="note">上圖為 16×16 原圖放大 12 倍的預覽（未做平滑處理），可看出字母 B 的像素邊界清楚不破碎。</p><p><a href="favicon.ico" download>下載 favicon.ico</a></p>
</body>

</html>
