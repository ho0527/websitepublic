<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>D4 Text Mask</title>
	<style>
		body {
			margin: 0;
			height: 100vh;
			display: grid;
			place-items: center;
			background: #111827;
			font-family: Impact, Arial Black, sans-serif
		}

		.mask {
			font-size: clamp(70px, 18vw, 180px);
			font-weight: 900;
			letter-spacing: 4px;
			background: url("asset.png") center/cover;
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
			-webkit-text-fill-color: transparent;
			text-transform: uppercase;
			text-align: center;
			filter: drop-shadow(0 8px 22px #000);
		}
	</style>
</head>

<body>
	<div class="mask">RUN</div>
</body>

</html>
