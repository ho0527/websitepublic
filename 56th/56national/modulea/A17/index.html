<!DOCTYPE html>
<html lang="zh-Hant">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>A17 輪播圖</title>
	<style>
		/*
		 * A17: 輪播圖（等級 3）
		 * 12 張圖片排成 3D 圓柱，持續向左旋轉；滑鼠懸停在圖片上時套用懸停效果。
		 */

		body {
			margin: 0px;
			min-height: 100vh;
			display: grid;
			place-items: center;
			background: radial-gradient(circle at 50% 40%, #2b3140, #05070c 70%);
			overflow: hidden;
		}

		.stage {
			perspective: 1400px;
			width: 320px;
			height: 260px;
		}

		.carousel {
			position: relative;
			width: 100%;
			height: 100%;
			transform-style: preserve-3d;
			animation: spin 24s linear infinite;
		}

		/* 向左旋轉（Y 軸負方向） */
		@keyframes spin {
			from {
				transform: rotateY(0deg);
			}

			to {
				transform: rotateY(-360deg);
			}
		}

		/*
		 * 12 張圖平均分佈在圓周上：每張間隔 30 度，
		 * 再往外推 520px 形成圓柱（translateZ）。
		 */
		.item {
			position: absolute;
			top: 0px;
			left: 0px;
			width: 320px;
			height: 240px;
			border-radius: 10px;
			overflow: hidden;
			box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.55);
			transition-duration: 0.4s;
		}

		.item img {
			width: 100%;
			height: 100%;
			object-fit: cover;
			display: block;
		}

		/* 懸停效果：放大、提高亮度並加上外框光暈 */
		.item:hover {
			transform: scale(1.12);
			box-shadow: 0px 0px 28px rgba(120, 200, 255, 0.9);
			z-index: 10;
		}

		.item:hover img {
			filter: brightness(1.25) saturate(1.2);
		}

		.item:nth-child(1)  { transform: rotateY(0deg)   translateZ(520px); }
		.item:nth-child(2)  { transform: rotateY(30deg)  translateZ(520px); }
		.item:nth-child(3)  { transform: rotateY(60deg)  translateZ(520px); }
		.item:nth-child(4)  { transform: rotateY(90deg)  translateZ(520px); }
		.item:nth-child(5)  { transform: rotateY(120deg) translateZ(520px); }
		.item:nth-child(6)  { transform: rotateY(150deg) translateZ(520px); }
		.item:nth-child(7)  { transform: rotateY(180deg) translateZ(520px); }
		.item:nth-child(8)  { transform: rotateY(210deg) translateZ(520px); }
		.item:nth-child(9)  { transform: rotateY(240deg) translateZ(520px); }
		.item:nth-child(10) { transform: rotateY(270deg) translateZ(520px); }
		.item:nth-child(11) { transform: rotateY(300deg) translateZ(520px); }
		.item:nth-child(12) { transform: rotateY(330deg) translateZ(520px); }

		/* 懸停時同時保留原本的圓周位置，再疊加放大效果 */
		.item:nth-child(1):hover  { transform: rotateY(0deg)   translateZ(560px) scale(1.1); }
		.item:nth-child(2):hover  { transform: rotateY(30deg)  translateZ(560px) scale(1.1); }
		.item:nth-child(3):hover  { transform: rotateY(60deg)  translateZ(560px) scale(1.1); }
		.item:nth-child(4):hover  { transform: rotateY(90deg)  translateZ(560px) scale(1.1); }
		.item:nth-child(5):hover  { transform: rotateY(120deg) translateZ(560px) scale(1.1); }
		.item:nth-child(6):hover  { transform: rotateY(150deg) translateZ(560px) scale(1.1); }
		.item:nth-child(7):hover  { transform: rotateY(180deg) translateZ(560px) scale(1.1); }
		.item:nth-child(8):hover  { transform: rotateY(210deg) translateZ(560px) scale(1.1); }
		.item:nth-child(9):hover  { transform: rotateY(240deg) translateZ(560px) scale(1.1); }
		.item:nth-child(10):hover { transform: rotateY(270deg) translateZ(560px) scale(1.1); }
		.item:nth-child(11):hover { transform: rotateY(300deg) translateZ(560px) scale(1.1); }
		.item:nth-child(12):hover { transform: rotateY(330deg) translateZ(560px) scale(1.1); }
	</style>
</head>

<body>
	<div class="stage">
		<div class="carousel">
			<div class="item"><img src="images/image1.jpg" alt="image1"></div>
			<div class="item"><img src="images/image2.jpg" alt="image2"></div>
			<div class="item"><img src="images/image3.jpg" alt="image3"></div>
			<div class="item"><img src="images/image4.jpg" alt="image4"></div>
			<div class="item"><img src="images/image5.jpg" alt="image5"></div>
			<div class="item"><img src="images/image6.jpg" alt="image6"></div>
			<div class="item"><img src="images/image7.jpg" alt="image7"></div>
			<div class="item"><img src="images/image8.jpg" alt="image8"></div>
			<div class="item"><img src="images/image9.jpg" alt="image9"></div>
			<div class="item"><img src="images/image10.jpg" alt="image10"></div>
			<div class="item"><img src="images/image11.jpg" alt="image11"></div>
			<div class="item"><img src="images/image12.jpg" alt="image12"></div>
		</div>
	</div>
</body>

</html>
